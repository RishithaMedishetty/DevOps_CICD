<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Food - Food Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #f9f7f4;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            background-color: #f9f7f4;
            border-bottom: 1px solid #e0d5c7;
        }

        .menu-icon {
            font-size: 28px;
            cursor: pointer;
        }

        .title {
            font-size: 32px;
            font-weight: 300;
            text-align: center;
            flex: 1;
        }

        .mail-icon {
            font-size: 24px;
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .gallery-item {
            text-align: center;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .gallery-item h3 {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 0;
            color: #333;
        }

        @media (max-width: 768px) {
            header {
                padding: 20px 30px;
            }

            .title {
                font-size: 24px;
            }

            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="menu-icon">☰</div>
        <h1 class="title">My Food</h1>
        <div class="mail-icon">✉</div>
    </header>

    <div class="container">
        <div class="gallery">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=400&h=300&fit=crop" alt="Sandwich">
                <h3>Sandwich</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&h=300&fit=crop" alt="Steak">
                <h3>Steak</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1579954587222-2d6e53a57d8f?w=400&h=300&fit=crop" alt="Milkshake">
                <h3>Milkshake</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=400&h=300&fit=crop" alt="Pasta">
                <h3>Pasta</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&h=300&fit=crop" alt="Burger">
                <h3>Burger</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400&h=300&fit=crop" alt="Dessert">
                <h3>Dessert</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1585867741668-629a9d00fcff?w=400&h=300&fit=crop" alt="Veg Biryani">
                <h3>Veg Biryani</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&h=300&fit=crop" alt="Chicken Biryani">
                <h3>Chicken Biryani</h3>
            </div>
        </div>
    </div>
</body>
</html>
